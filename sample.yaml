sample:
  description: Drive the HTTP server over a UART with bare data buffers, without a
    network stack
  name: http_server_bare_sample
common:
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "UART .* wired to the HTTP server"
      - "request 1: feeding .* bytes in two chunks"
      - "connection still up: yes"
      - "request 2: feeding .* bytes in two chunks"
      - "connection still up: yes"
      - "request 3: feeding .* bytes in two chunks"
      - "connection still up: yes"
      - "Self-test done"
  tags:
    - http
    - net
    - server
    - socket
    - uart
  integration_platforms:
    - native_sim
tests:
  sample.net.sockets.http.server.bare: {}
