sample:
  description: Download and upload files over a UART with bare data buffers, without
    a network stack
  name: http_server_bare_sample
common:
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "UART .* wired to the HTTP server"
      - "request 1: feeding .* bytes in two chunks"
      - "GET /lfs/hello.txt"
      - "request 2: feeding .* bytes in two chunks"
      - "PUT /lfs/upload.txt"
      - "request 3: feeding .* bytes in two chunks"
      - "GET /lfs/upload.txt"
      - "request 4: feeding .* bytes in two chunks"
      - "GET /files/missing.txt"
      - "Self-test done"
  tags:
    - http
    - uart
    - filesystem
  integration_platforms:
    - native_sim
tests:
  sample.net.http.server.bare: {}
