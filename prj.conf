CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_PRINTK=y

# C++
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# UART carrying the HTTP byte stream, aliased as http-uart in the board overlay.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# The HTTP server is written against the socket API, so the socket layer (and
# therefore CONFIG_NETWORKING) must be in. Nothing below it is: there is no L2
# driver, no TCP, and no address is ever bound. The only descriptors in play
# are socketpair ends and the custom listening socket in raw_http.cpp.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETPAIR=y
CONFIG_NET_SOCKETPAIR_STATIC=y
# Two pairs of headroom: a relink may briefly overlap with the outgoing one.
CONFIG_NET_SOCKETPAIR_MAX=2
CONFIG_NET_SOCKETPAIR_BUFFER_SIZE=2048

# No native IP stack, no L2, no driver. NET_NATIVE=n drops net_context, net_pkt,
# connection tracking and the IPv4/IPv6 code from the build entirely.
CONFIG_NET_NATIVE=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_NATIVE_TAP=n

# http_server_init() fills in a sockaddr before it calls the socket_create
# hook, and gives up if neither address family is available. With NET_NATIVE=n
# this only keeps the address family constant alive; no IPv4 code is built.
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n

# Needed by the HTTP server to wake its poll() loop on shutdown.
CONFIG_EVENTFD=y
CONFIG_ZVFS_POLL_MAX=8
# stdin/stdout/stderr, the server's eventfd, the bare listening socket and both
# socketpair ends.
CONFIG_ZVFS_OPEN_MAX=16

CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_1=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_MAX_CLIENTS=1

# Sized to swallow one application input buffer per recv(). For HTTP/1 this is
# only a throughput knob: the parser is incremental and the buffer is compacted
# after every pass, so a request head may be arbitrarily larger than this. It
# becomes a hard limit if HTTP/2 is enabled, where a whole frame must fit.
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048

# The actual bound on a request head: the URL is accumulated whole (default 256,
# max 2048). Captured header fields are bound by HTTP_SERVER_MAX_HEADER_LEN.
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256

# A UART link may sit idle for a long time between requests. The server drops a
# client after this many seconds of silence; 86400 is the maximum. Note that the
# drop is attempted with shutdown(), which a socketpair does not implement, so
# over this transport the timeout is a no-op anyway - but do not rely on that,
# BareHttpServer::input() relinks if the connection ever does go away.
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=86400

# Filesystem the HTTP server serves files from and uploads into. A real board
# would already have this mounted; native_sim gets a littlefs on the flash
# simulator so the sample has somewhere to put files.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# "/files/*" needs wildcard resource matching.
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
