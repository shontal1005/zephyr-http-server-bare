CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_PRINTK=y

# C++
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# UART carrying the HTTP byte stream, aliased as http-uart in the board overlay.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# The only networking code in the image is the HTTP/1.1 request parser
# library. Its Kconfig lives under the networking menu, so CONFIG_NETWORKING
# must be set to reach it - but no sockets, L2, IP or TCP are built.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_NATIVE_TAP=n
CONFIG_HTTP_PARSER=y

# Filesystem the server serves files from and uploads into. A real board would
# already have this mounted; native_sim gets a littlefs on the flash simulator
# so the sample has somewhere to put files.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
