CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_PRINTK=y

# C++
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# The UART bridge: interrupt-driven RX on the http-uart alias, buffered
# through a ring until the feed thread hands it to the server.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# The library. RAW_HTTP_SERVER selects NETWORKING (only to reach the HTTP
# parser's Kconfig) and HTTP_PARSER, and its module Kconfig defaults the
# native IP stack off.
CONFIG_RAW_HTTP_SERVER=y

# The one thing the module cannot default away: native_sim's own
# Kconfig.defconfig turns Ethernet on whenever networking is in the build,
# and board defaults deliberately outrank module defaults. The TAP driver
# falls away with it.
CONFIG_NET_L2_ETHERNET=n

# Filesystem the server serves files from and uploads into. A real board would
# already have this mounted; native_sim gets a littlefs on the flash simulator
# so the sample has somewhere to put files.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
